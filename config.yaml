entry_filters:
  curve_mc_min_usd: 5000
  curve_mc_max_usd: 80000
  age_min_minutes: 5
  age_max_minutes: 180
  volume_1h_min_usd: 10000
  volume_surge_min: 1.5
  top10_pct_max: 60.0
  top1_pct_max: 20.0
  fresh_top_holders_pct_max: 40.0
  early_dump_pct_max: 50.0
  bundle_supply_pct_max: 15.0
  sniper_supply_pct_max: 20.0
  curve_progress_min_pct: 60.0
  curve_progress_max_pct: 80.0
  dev_history:
    max_past_rugs: 1
    min_migrated_count: 0

exit_triggers:
  lp_removal: true
  whale_dump_threshold_pct: 15.0
  sell_dominance_threshold: 0.25
  volume_collapse_threshold: 0.3
  post_migration_slippage_max_pct: 5.0

scoring_weights:
  market: 0.25
  pressure: 0.25
  risk: 0.30
  dev: 0.20

backtest:
  entry_delay_seconds: 30
  slippage_model: curve_based
  fixed_slippage_pct: 1.0
  fee_pct: 0.25
  take_profit_multipliers: [1.5, 2.0, 3.0, 5.0]
  stop_loss_pct: -40.0
  max_hold_minutes: 240
  paper_mode: false
