[project]
name = "token-analytics-backtest"
version = "0.1.0"
description = "Pump.fun/Solana token analytics + deterministic backtest framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
token-analytics = "token_analytics.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
